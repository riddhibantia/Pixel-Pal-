name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Create local.properties (CI stub)
        run: echo "GEMINI_API_KEY=dummy" > local.properties
      - name: Assemble Debug
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Check Room schemas in sync (KSP diff)
        run: git diff --exit-code -- app/schemas/ || (echo "::error::Room schemas changed. Commit app/schemas/ from a local build." && exit 1)
      - name: Unit Tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Create local.properties (CI stub)
        run: echo "GEMINI_API_KEY=dummy" > local.properties
      - name: Instrumented tests (emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
  rules:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Firestore rules (needs FIREBASE_TOKEN)
        if: env.FIREBASE_TOKEN != ''
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx -y firebase-tools deploy --only firestore:rules --token "$FIREBASE_TOKEN"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
