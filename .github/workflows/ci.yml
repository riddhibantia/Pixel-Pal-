name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Create local.properties (CI stub)
        run: echo "GEMINI_API_KEY=dummy" > local.properties
      - name: Assemble Debug
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Check Room schemas in sync (KSP diff)
        run: git diff --exit-code -- app/schemas/ || (echo "::error::Room schemas changed. Commit app/schemas/ from a local build." && exit 1)
      - name: Unit Tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Create local.properties (CI stub)
        run: echo "GEMINI_API_KEY=dummy" > local.properties
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-options: '-no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none'
          disable-animations: true
          script: |
            adb devices
            adb -s emulator-5554 shell getprop ro.build.version.sdk
            adb -s emulator-5554 shell getprop sys.boot_completed
            ./gradlew :app:connectedDebugAndroidTest --stacktrace
  rules:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Firestore rules (needs FIREBASE_TOKEN)
        if: env.FIREBASE_TOKEN != ''
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx -y firebase-tools deploy --only firestore:rules --token "$FIREBASE_TOKEN"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
